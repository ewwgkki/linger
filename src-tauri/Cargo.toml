[package]
name = "linger"
version = "0.1.0"
description = "Linger · 余音 — an ad-free local music player"
authors = ["ewwgkki"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "linger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
regex = "1"
encoding_rs = "0.8"
